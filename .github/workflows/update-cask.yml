name: Update Homebrew Cask

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update the cask to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          ASSET="PullJoy-$VERSION.zip"
          gh release download "$TAG" -p "$ASSET"
          SHA="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$ASSET\") | .id")"
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/; s#releases/assets/[0-9]*#releases/assets/$ID#" Casks/pulljoy.rb

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pulljoy.rb
          git diff --cached --quiet || git commit -m "Update cask to $TAG"
          git push
